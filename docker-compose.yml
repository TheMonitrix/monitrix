version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=signoz

  backend:
    build:
      context: ./path-to-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - clickhouse
    environment:
      - CLICKHOUSE_URL=clickhouse://clickhouse:9000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - FRONTEND_API_ENDPOINT=http://backend:8080

volumes:
  clickhouse_data:
